
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 280"
     width="1000"
     height="280"
     role="img"
     aria-label="Kaaji - UI UX Designer and Interface Developer">

  <defs>
    <clipPath id="frame">
      <rect width="1000" height="280" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->
    <rect width="1000" height="280" fill="#080D1B"/>

    <!-- Grid -->
    <path d="
      M0 40 H1000 M0 80 H1000
      M0 120 H1000 M0 160 H1000
      M0 200 H1000 M0 240 H1000
      M40 0 V280 M80 0 V280
      M920 0 V280 M960 0 V280"
      stroke="#FFFFFF"
      stroke-opacity="0.025"
      stroke-width="1"/>

    <!-- Window indicators -->
    <circle cx="35" cy="34" r="5" fill="#F45B5B"/>
    <circle cx="54" cy="34" r="5" fill="#F5B942"/>
    <circle cx="73" cy="34" r="5" fill="#36B86A"/>

    <!-- Top decoration -->
    <path d="M730 0 L750 20 H990"
          fill="none"
          stroke="#64748B"
          stroke-width="1.5">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -15 0; 0 0"
        dur="7s"
        repeatCount="indefinite"/>
    </path>

    <!-- Right decoration -->
    <g fill="#334155">
      <path d="M890 30 H910 L885 62 H865 Z"/>
      <path d="M930 30 H950 L925 62 H905 Z"/>
      <path d="M970 30 H990 L965 62 H945 Z"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -12 5; 0 0"
        dur="11s"
        repeatCount="indefinite"/>
    </g>

    <!-- Left decoration -->
    <g fill="#334155">
      <path d="M35 218 H55 L30 250 H10 Z"/>
      <path d="M75 218 H95 L70 250 H50 Z"/>
      <path d="M115 218 H135 L110 250 H90 Z"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 12 -5; 0 0"
        dur="9s"
        repeatCount="indefinite"/>
    </g>

    <!-- Bottom line -->
    <path d="M10 260 H245 L265 280"
          fill="none"
          stroke="#64748B"
          stroke-width="1.5"/>

    <!-- Main content -->
    <g text-anchor="middle"
       font-family="Arial, Helvetica, sans-serif">

      <!-- Name -->
      <text x="500"
            y="112"
            fill="#F8FAFC"
            font-size="58"
            font-weight="700"
            letter-spacing="0.5"
            opacity="0">

        Kaaji

        <animate
          attributeName="opacity"
          from="0"
          to="1"
          dur="1s"
          begin="0.2s"
          fill="freeze"/>

        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 12; 0 0"
          dur="1s"
          begin="0.2s"
          fill="freeze"/>
      </text>

      <!-- Main identity -->
      <text x="500"
            y="153"
            fill="#AAB8CE"
            font-size="15"
            font-weight="500"
            letter-spacing="2.5"
            opacity="0">

        UI/UX DESIGN  ·  INTERFACE  ·  DEVELOPMENT

        <animate
          attributeName="opacity"
          from="0"
          to="1"
          dur="1s"
          begin="0.55s"
          fill="freeze"/>

        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 12; 0 0"
          dur="1s"
          begin="0.55s"
          fill="freeze"/>
      </text>

      <!-- Divider -->
      <line x1="500"
            y1="176"
            x2="500"
            y2="176"
            stroke="#475569"
            stroke-width="1">

        <animate
          attributeName="x1"
          from="500"
          to="270"
          dur="1s"
          begin="0.8s"
          fill="freeze"/>

        <animate
          attributeName="x2"
          from="500"
          to="730"
          dur="1s"
          begin="0.8s"
          fill="freeze"/>
      </line>

      <!-- Website and location -->
      <g fill="#94A3B8"
         font-size="15"
         letter-spacing="1"
         opacity="0">

        <text x="430" y="207" text-anchor="end">
          kaami.my.id
        </text>

        <circle cx="460" cy="202" r="2" fill="#64748B">
          <animate
            attributeName="opacity"
            values="0.55;1;0.55"
            dur="2s"
            repeatCount="indefinite"/>
        </circle>

        <text x="480" y="207" text-anchor="start">
          Makassar, Indonesia
        </text>

        <animate
          attributeName="opacity"
          from="0"
          to="1"
          dur="1s"
          begin="1s"
          fill="freeze"/>

        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 12; 0 0"
          dur="1s"
          begin="1s"
          fill="freeze"/>
      </g>

    </g>

  </g>

  <!-- Border -->
  <rect x="0.5"
        y="0.5"
        width="999"
        height="279"
        rx="13.5"
        fill="none"
        stroke="#334155"
        stroke-opacity="0.65"/>

</svg>
