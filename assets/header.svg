
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 280"
     width="1000"
     height="280"
     role="img"
     aria-label="Eka Aji Pramudia - Fullstack Developer and UI UX Designer">

  <defs>
    <clipPath id="frame">
      <rect width="1000" height="280" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->
    <rect width="1000" height="280" fill="#080D1B"/>

    <!-- Subtle grid -->
    <path d="
      M0 40 H1000
      M0 80 H1000
      M0 120 H1000
      M0 160 H1000
      M0 200 H1000
      M0 240 H1000
      M40 0 V280
      M80 0 V280
      M920 0 V280
      M960 0 V280"
      stroke="#FFFFFF"
      stroke-opacity="0.025"
      stroke-width="1"/>

    <!-- Window indicators -->
    <circle cx="35" cy="34" r="5" fill="#F45B5B"/>
    <circle cx="54" cy="34" r="5" fill="#F5B942"/>
    <circle cx="73" cy="34" r="5" fill="#36B86A"/>

    <!-- Top right decoration -->
    <path d="M730 0 L750 20 H990"
          fill="none"
          stroke="#64748B"
          stroke-width="1.5"/>

    <g fill="#334155">
      <path d="M890 30 H910 L885 62 H865 Z"/>
      <path d="M930 30 H950 L925 62 H905 Z"/>
      <path d="M970 30 H990 L965 62 H945 Z"/>
    </g>

    <!-- Bottom left decoration -->
    <g fill="#334155">
      <path d="M35 218 H55 L30 250 H10 Z"/>
      <path d="M75 218 H95 L70 250 H50 Z"/>
      <path d="M115 218 H135 L110 250 H90 Z"/>
    </g>

    <path d="M10 260 H245 L265 280"
          fill="none"
          stroke="#64748B"
          stroke-width="1.5"/>

    <!-- Main content -->
    <g text-anchor="middle"
       font-family="Arial, Helvetica, sans-serif">

      <!-- Name -->
      <text x="500"
            y="112"
            fill="#F8FAFC"
            font-size="49"
            font-weight="700"
            letter-spacing="-1.5">
        Eka Aji Pramudia
      </text>

      <!-- Profession -->
      <text x="500"
            y="153"
            fill="#AAB8CE"
            font-size="15"
            font-weight="500"
            letter-spacing="3">
        KAAJI  ·  FULLSTACK DEVELOPER  ·  UI/UX DESIGNER
      </text>

      <!-- Divider -->
      <line x1="270"
            y1="176"
            x2="730"
            y2="176"
            stroke="#475569"
            stroke-width="1"/>

      <!-- Website and location -->
      <g fill="#94A3B8"
         font-size="15"
         letter-spacing="1">

        <text x="430" y="207" text-anchor="end">
          kaami.my.id
        </text>

        <circle cx="460" cy="202" r="2" fill="#64748B"/>

        <text x="480" y="207" text-anchor="start">
          Makassar, Indonesia
        </text>

      </g>

    </g>

  </g>

  <!-- Outer border -->
  <rect x="0.5"
        y="0.5"
        width="999"
        height="279"
        rx="13.5"
        fill="none"
        stroke="#334155"
        stroke-opacity="0.65"/>

</svg>
